    <script>
        // Infra Control 80f: shows what the last command of a phone remote did. control.html receives
        // the remotes (Bluetooth serial port) and sends {remote 1-4, typed address digits, dir
        // (null = no loco), functions f0-f4, connected, text}. The lock LED glows while a remote
        // is connected.
        const $ = id => document.getElementById(id);

        function show(s) {
            $('lock').classList.toggle('off', !s.connected);
            $('remote').textContent = s.remote || '';
            $('digit1').textContent = s.digits[0] || '';
            $('digit2').textContent = s.digits[1] || '';
            $('up').classList.toggle('off', s.dir !== false);
            $('down').classList.toggle('off', s.dir !== true);
            s.functions.forEach((on, i) => $('f' + i).classList.toggle('off', !on));
        }

        window.addEventListener('message', e => {
            if (!EMBEDDED || e.source !== window.parent || !e.data || e.data.type !== 'marklin-infra') return;
            show(e.data);
            if (e.data.text) console.log(e.data.text);
        });
    </script>
